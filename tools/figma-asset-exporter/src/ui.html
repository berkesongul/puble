<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font-family: Inter, system-ui, sans-serif;
        font-size: 12px;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }
      main { display: grid; gap: 16px; padding: 20px; }
      h1 { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
      p { margin: 6px 0 0; color: var(--figma-color-text-secondary); line-height: 1.5; }
      label { display: grid; gap: 6px; font-weight: 600; }
      input, select, button {
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--figma-color-border);
        border-radius: 8px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font: inherit;
      }
      input, select { padding: 0 10px; }
      input:focus, select:focus {
        border-color: var(--figma-color-border-selected);
        outline: 2px solid var(--figma-color-bg-brand-tertiary);
      }
      button { cursor: pointer; padding: 0 14px; font-weight: 600; }
      button:hover:not(:disabled) { background: var(--figma-color-bg-hover); }
      button:disabled { cursor: default; opacity: 0.45; }
      button.primary {
        border-color: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
      }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .card {
        padding: 12px;
        border: 1px solid var(--figma-color-border);
        border-radius: 10px;
        background: var(--figma-color-bg-secondary);
      }
      .card h2 { margin: 0 0 8px; font-size: 12px; }
      ul { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
      li { display: flex; justify-content: space-between; gap: 12px; }
      progress { width: 100%; height: 6px; }
      #status { min-height: 18px; color: var(--figma-color-text-secondary); }
      #status[data-error="true"] { color: var(--figma-color-text-danger); }
      footer { display: flex; justify-content: flex-end; }
      footer button { width: auto; min-height: 30px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Puble Asset Exporter</h1>
        <p>Üst seviye grupları klasör, doğrudan çocuklarını isimlendirilmiş asset olarak ZIP'e aktarır.</p>
      </header>

      <label>
        Figma sayfası
        <input id="page-name" value="AI Implemention" autocomplete="off" />
      </label>

      <div class="grid">
        <label>
          Format
          <select id="format">
            <option value="SVG">SVG</option>
            <option value="PNG">PNG</option>
          </select>
        </label>
        <label>
          PNG ölçeği
          <select id="png-scale">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="scan">Yeniden tara</button>
        <button id="export" class="primary" disabled>Assetleri indir</button>
      </div>

      <progress id="progress" value="0" max="1" hidden></progress>
      <div id="status">Sayfa taranıyor…</div>

      <section id="summary" class="card" hidden>
        <h2>Klasörler</h2>
        <ul id="categories"></ul>
      </section>

      <footer>
        <button id="close">Kapat</button>
      </footer>
    </main>
    <script>/*__UI_SCRIPT__*/</script>
  </body>
</html>
